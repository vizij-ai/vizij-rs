<!doctype html>
<meta charset="utf-8">
<title>@vizij/runtime browser harness</title>
<style>
  body { margin: 0; background: #202020; }
  /* The canvas is exactly the reference render's size at device pixel ratio 1. */
  #stage { position: relative; width: 763px; height: 486px; }
  #faces { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
</style>
<div id="stage"><canvas id="faces"></canvas></div>
<!-- The package's dist imports its workspace siblings by name; the page maps
     them onto their dist (the server follows pnpm's node_modules links). -->
<script type="importmap">
  {
    "imports": {
      "@vizij/value-json": "/node_modules/@vizij/value-json/dist/index.js",
      "@vizij/wasm-loader": "/node_modules/@vizij/wasm-loader/dist/browser.js",
      "@vizij/wasm-loader/browser": "/node_modules/@vizij/wasm-loader/dist/browser.js"
    }
  }
</script>
<script type="module">
  import * as vizij from "../../dist/runtime/src/index.js";

  const params = new URLSearchParams(location.search);
  const background = params.get("background") ?? "000000";
  const canvas = document.getElementById("faces");
  const contextEvents = [];
  canvas.addEventListener("webglcontextlost", () => contextEvents.push("lost"));
  canvas.addEventListener("webglcontextrestored", () => contextEvents.push("restored"));

  await vizij.init();
  await vizij.mount("#faces", { background });

  // The page owns every device and steps it on its own frames.
  const devices = new Map();
  const stepErrors = [];
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(t - last, 100);
    last = t;
    for (const [id, device] of devices) {
      try {
        device.step(dt);
      } catch (e) {
        stepErrors.push(`${id}: ${e}`);
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  const glbs = new Map();
  async function glb(url) {
    if (!glbs.has(url)) {
      glbs.set(url, new Uint8Array(await (await fetch(url)).arrayBuffer()));
    }
    return glbs.get(url);
  }

  // A scripted playback hook for the speech tests: no audio output, a
  // playhead at a quarter of the wall clock from the first poll, advancing
  // at most 10 ms per poll, ending after 260 ms; what it received is kept
  // for the test to read. The crossfade smoother runs on `arora/dt`, so a
  // shape's weight rises with the wall time it stays current, and the test
  // reads the weights from JavaScript at whatever cadence a busy page
  // grants it: a 100 ms mark has to span several of those reads at its
  // full weight. At a quarter speed a mark lasts 400 ms on a page stepping
  // every few milliseconds; bounded per poll, it lasts ten polls on a page
  // stepping every 200 ms rather than being skipped.
  window.vizijPlayback = { calls: [] };
  const scriptedPlay = (bytes, marks) => {
    let t = 0;
    let last;
    const call = { bytes: bytes.length, marks: marks.length, polls: 0, at: [] };
    window.vizijPlayback.calls.push(call);
    return () => {
      const now = performance.now();
      if (last !== undefined) t += Math.min(10, (now - last) / 4);
      last = now;
      call.polls += 1;
      call.at.push([Math.round(now), Math.round(t)]);
      return t > 260 ? null : t;
    };
  };

  // Resolves on the first animation frame where `ready(id)` reads true.
  const nextReady = (id) =>
    new Promise((resolve) => {
      const poll = () => (vizij.ready(id) ? resolve() : requestAnimationFrame(poll));
      poll();
    });

  window.vizijHarness = {
    memory: () => vizij.memoryBytes(),
    // Loading under an id already shown is a reload: the new device takes
    // over and the previous one is disposed.
    async load(id, url, options) {
      const scripted = options && options.audio === "scripted";
      const device = await vizij.loadVizij(id, await glb(url), {
        ...options,
        audio: scripted ? scriptedPlay : options?.audio,
        speechApiUrl: scripted ? location.origin : options?.speechApiUrl,
      });
      devices.get(id)?.dispose();
      devices.set(id, device);
      return { rigPrefix: device.rigPrefix };
    },
    // A reload from GLB bytes, timed: `loadMs` until `loadVizij` returns
    // (the GLB read, the graphs composed, the device built), `readyMs`
    // until the new scene is indexed and posed — the frame the swap lands.
    async reload(id, url, options) {
      const bytes = await glb(url);
      const start = performance.now();
      const device = await vizij.loadVizij(id, bytes, { audio: false, ...options });
      const loadMs = performance.now() - start;
      devices.get(id)?.dispose();
      devices.set(id, device);
      const readyAt = vizij.ready(id);
      await nextReady(id);
      return { loadMs, readyMs: performance.now() - start, readyAt };
    },
    // A Vizij from bytes the page built (an edited or exported GLB).
    async loadBytes(id, bytes, options) {
      const device = await vizij.loadVizij(id, bytes, { audio: false, ...options });
      devices.get(id)?.dispose();
      devices.set(id, device);
      return { rigPrefix: device.rigPrefix };
    },
    describe: async (url) => vizij.describe(await glb(url)),
    describeBytes: (bytes) => vizij.describe(bytes),
    rigPrefix: (id) => ({ rigPrefix: devices.get(id).rigPrefix }),
    select: (id, elementIds) => vizij.setSelection(id, elementIds),
    setStatic: (id, elementId, feature, value) =>
      vizij.setStaticFeature(id, elementId, feature, value),
    hold: (id, paths) => devices.get(id).hold(paths),
    release: (id, paths) => devices.get(id).release(paths),
    spawn: (id, call) => devices.get(id).spawn(call),
    spawnSkill: (id, name, args) => devices.get(id).spawnSkill(name, args),
    runStatus: (value) => vizij.runStatus(value),
    halt: (id, handle) => devices.get(id).halt(handle),
    reset: (id) => devices.get(id).reset(),
    snapshot: (id) => devices.get(id).snapshot(),
    place: (id, rect) => vizij.placeVizij(id, rect),
    setView: (id, view) => vizij.setView(id, view),
    safeArea: (id) => vizij.safeArea(id),
    ready: (id) => vizij.ready(id),
    unload(id) {
      const device = devices.get(id);
      if (!device) return false;
      vizij.unloadVizij(id);
      device.dispose();
      devices.delete(id);
      return true;
    },
    setValue: (id, path, value) => devices.get(id).setValue(path, value),
    readValues: (id, paths) => devices.get(id).readValues(paths),
    path: (id, relative) => devices.get(id).path(relative),
    device: (id) => devices.get(id),
    picks: () => vizij.drainPicks(),
    state: () => {
      const gl = canvas.getContext("webgl2");
      return {
        faces: [...devices.keys()],
        stepErrors: stepErrors.slice(0, 5),
        contextEvents: contextEvents.slice(),
        contextLost: gl ? gl.isContextLost() : null,
      };
    },
  };
  window.vizijHarnessReady = true;
</script>
