[workspace]
members = [
  "crates/animation/vizij-animation-core",
  "crates/animation/vizij-animation-wasm",
  "crates/node-graph/vizij-graph-core",
  "crates/node-graph/vizij-graph-wasm",
  "crates/node-graph/vizij-graph-registry-export",
  "crates/api/vizij-api-core",
  "crates/api/vizij-api-wasm",
  "crates/test-fixtures/vizij-test-fixtures",
  "crates/interop/vizij-arora",
  "crates/interop/vizij-animation-module",
  "crates/interop/vizij-arora-store",
  "crates/interop/vizij-arora-hal",
  "crates/interop/vizij-arora-behavior",
  "crates/interop/vizij-arora-host",
  "crates/interop/vizij-arora-tts",
  "crates/interop/vizij-piper",
  "crates/tools/vizij-bundle",
  "crates/tools/vizij-glb-migrate",
  "crates/vizij",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hashbrown = { version = "0.17", features = ["serde"] }
wasm-bindgen = "0.2.101"
js-sys = "0.3"
anyhow = "1"
serde-wasm-bindgen = "0.6"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The face-interfaces spike: the arora-sdk worktree serving the face skills
# over ROS 2. Every crate whose types cross between vizij and the bridge comes
# from it, so one copy of each is in the graph.
[patch.crates-io]
arora-types = { path = "../../arora-sdk-wt/face-interfaces/crates/arora-types" }
arora-types-derive = { path = "../../arora-sdk-wt/face-interfaces/crates/arora-types-derive" }
arora-behavior = { path = "../../arora-sdk-wt/face-interfaces/crates/arora-behavior" }
arora-bridge = { path = "../../arora-sdk-wt/face-interfaces/crates/arora-bridge" }
arora-behavior-tree-types = { path = "../../arora-sdk-wt/face-interfaces/crates/arora-behavior-tree-types" }
arora-msgs-ros2 = { path = "../../arora-sdk-wt/face-interfaces/crates/arora-msgs-ros2" }
arora-bridge-ros2 = { path = "../../arora-sdk-wt/face-interfaces/crates/arora-bridge-ros2" }
