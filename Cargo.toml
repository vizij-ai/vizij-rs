[workspace]
members = [
  "crates/animation/vizij-animation-core",
  "crates/animation/vizij-animation-wasm",
  "crates/node-graph/vizij-graph-core",
  "crates/node-graph/vizij-graph-wasm",
  "crates/node-graph/vizij-graph-registry-export",
  "crates/api/vizij-api-core",
  "crates/api/vizij-api-wasm",
  "crates/test-fixtures/vizij-test-fixtures",
  "crates/interop/vizij-arora",
  "crates/interop/vizij-animation-module",
  "crates/interop/vizij-arora-store",
  "crates/interop/vizij-arora-hal",
  "crates/interop/vizij-arora-behavior",
  "crates/interop/vizij-arora-host",
  "crates/interop/vizij-arora-tts",
  "crates/interop/vizij-piper",
  "crates/tools/vizij-bundle",
  "crates/tools/vizij-glb-migrate",
  "crates/vizij",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hashbrown = { version = "0.17", features = ["serde"] }
wasm-bindgen = "0.2.101"
js-sys = "0.3"
anyhow = "1"
serde-wasm-bindgen = "0.6"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# arora-msgs-ros2 2.2 (ClosedCaption, diagnostic_msgs) and arora-bridge-ros2
# 10.4 (the ROS4HRI preset's /closed_captions and /diagnostics) from their
# arora-sdk pull request until they are on crates.io. Every crate whose types
# cross between vizij and the bridge comes from it, so one copy of each is in
# the graph.
[patch.crates-io]
arora-types = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/ros4hri-captions-diagnostics" }
arora-types-derive = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/ros4hri-captions-diagnostics" }
arora-behavior = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/ros4hri-captions-diagnostics" }
arora-bridge = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/ros4hri-captions-diagnostics" }
arora-behavior-tree-types = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/ros4hri-captions-diagnostics" }
arora-msgs-ros2 = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/ros4hri-captions-diagnostics" }
arora-bridge-ros2 = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/ros4hri-captions-diagnostics" }
