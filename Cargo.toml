[workspace]
members = [
  "crates/node-graph/vizij-graph-core",
  "crates/node-graph/vizij-graph-wasm",
  "crates/node-graph/vizij-graph-registry-export",
  "crates/api/vizij-api-core",
  "crates/api/vizij-api-wasm",
  "crates/test-fixtures/vizij-test-fixtures",
  "crates/interop/vizij-arora",
  "crates/interop/vizij-animation-artifact",
  "crates/interop/vizij-arora-store",
  "crates/interop/vizij-arora-hal",
  "crates/interop/vizij-arora-behavior",
  "crates/interop/vizij-arora-host",
  "crates/interop/vizij-arora-tts",
  "crates/interop/vizij-piper",
  "crates/tools/vizij-bundle",
  "crates/tools/vizij-glb-migrate",
  "crates/vizij",
  "crates/vizij-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hashbrown = { version = "0.17", features = ["serde"] }
wasm-bindgen = "0.2.101"
js-sys = "0.3"
anyhow = "1"
serde-wasm-bindgen = "0.6"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The release code without its fat LTO, for measuring it (the frame_cost
# and load_cost examples): a build of the whole view links in a fraction of
# the time and memory, with line tables for a profiler.
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"

# The node graph runs on arora-sdk's behavior tree (arora-dataflow-nodes,
# arora-geometry, arora-behavior-tree 9.5 and arora-types 3.9), which
# crates.io does not have yet: those four come from arora-sdk's main. The
# other arora crates they depend on by path within arora-sdk resolve to their
# crates.io releases, which are the same versions, so the workspace builds
# one copy of each. Remove both tables once the four are published.
[patch.crates-io]
arora-behavior-tree = { git = "https://github.com/semio-ai/arora-sdk", branch = "main" }
arora-dataflow-nodes = { git = "https://github.com/semio-ai/arora-sdk", branch = "main" }
arora-geometry = { git = "https://github.com/semio-ai/arora-sdk", branch = "main" }
arora-types = { git = "https://github.com/semio-ai/arora-sdk", branch = "main" }

[patch."https://github.com/semio-ai/arora-sdk"]
arora-behavior = "9.6"
arora-behavior-tree-types = "2.2"
arora-buffers = "3"
arora-simple-data-store = "3.2"
arora-types-derive = "2"
