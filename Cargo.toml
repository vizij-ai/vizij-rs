[workspace]
members = [
  "crates/animation/vizij-animation-core",
  "crates/animation/vizij-animation-wasm",
  "crates/node-graph/vizij-graph-core",
  "crates/node-graph/vizij-graph-wasm",
  "crates/node-graph/vizij-graph-registry-export",
  "crates/api/vizij-api-core",
  "crates/api/vizij-api-wasm",
  "crates/test-fixtures/vizij-test-fixtures",
  "crates/interop/vizij-arora",
  "crates/interop/vizij-animation-module",
  "crates/interop/vizij-arora-store",
  "crates/interop/vizij-arora-hal",
  "crates/interop/vizij-arora-behavior",
  "crates/interop/vizij-arora-host",
  "crates/interop/vizij-arora-tts",
  "crates/interop/vizij-piper",
  "crates/tools/vizij-bundle",
  "crates/tools/vizij-glb-migrate",
  "crates/vizij",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hashbrown = { version = "0.17", features = ["serde"] }
wasm-bindgen = "0.2.101"
js-sys = "0.3"
anyhow = "1"
serde-wasm-bindgen = "0.6"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The face skills over ROS 2 come from arora-sdk's face-interfaces branch
# (semio-ai/arora-sdk#344) until its releases are published; then this table
# goes, and the requirements name the released versions. Every arora crate
# whose types cross between vizij and the ROS 2 bridge is patched together,
# so one copy of each is in the graph.
[patch.crates-io]
arora-types = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/face-interfaces" }
arora-types-derive = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/face-interfaces" }
arora-behavior = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/face-interfaces" }
arora-bridge = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/face-interfaces" }
arora-behavior-tree-types = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/face-interfaces" }
arora-msgs-ros2 = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/face-interfaces" }
arora-bridge-ros2 = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/face-interfaces" }
