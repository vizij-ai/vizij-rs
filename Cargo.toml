[workspace]
members = [
  "crates/animation/vizij-animation-core",
  "crates/animation/vizij-animation-wasm",
  "crates/node-graph/vizij-graph-core",
  "crates/node-graph/vizij-graph-wasm",
  "crates/node-graph/vizij-graph-registry-export",
  "crates/api/vizij-api-core",
  "crates/api/vizij-api-wasm",
  "crates/test-fixtures/vizij-test-fixtures",
  "crates/interop/vizij-arora",
  "crates/interop/vizij-animation-module",
  "crates/interop/vizij-arora-store",
  "crates/interop/vizij-arora-hal",
  "crates/interop/vizij-arora-behavior",
  "crates/interop/vizij-arora-host",
  "crates/interop/vizij-arora-tts",
  "crates/interop/vizij-piper",
  "crates/tools/vizij-bundle",
  "crates/tools/vizij-glb-migrate",
  "crates/vizij",
  "crates/vizij-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hashbrown = { version = "0.17", features = ["serde"] }
wasm-bindgen = "0.2.101"
js-sys = "0.3"
anyhow = "1"
serde-wasm-bindgen = "0.6"

# TODO: drop this patch once arora-types 3.8, arora-module 2.2 and
# arora-registry 2.1 are on crates.io (semio-ai/arora-sdk#368). Until then the
# records of a declared module come from that pull request's branch; the
# crates that need them require those versions, so the build fails rather
# than falling back to crates.io if the patch stops applying.
[patch.crates-io]
arora-types = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/derive-type-records" }
arora-module = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/derive-type-records" }
arora-registry = { git = "https://github.com/semio-ai/arora-sdk", branch = "feat/derive-type-records" }

# arora-module's buffers come from crates.io, where the branch's 3.0.0 is
# published unchanged: built from the git checkout, their build script runs
# `cargo metadata` on the arora-sdk workspace, which stable cargo cannot parse
# (its `artifact` dependencies need `-Z bindeps`). It also keeps one
# arora-buffers for the guest and the engine.
[patch."https://github.com/semio-ai/arora-sdk"]
arora-buffers = "3.0.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The release code without its fat LTO, for measuring it (the frame_cost
# example): a build of the whole view links in a fraction of the time and
# memory, with line tables for a profiler.
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"
