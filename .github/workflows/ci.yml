name: ci
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_bench_smoke:
        description: "Run WASM bench smoke (signatures + OOM timing)"
        required: false
        default: "false"

concurrency:
  group: rs-ci-${{ github.ref }}
  cancel-in-progress: true

# Each Rust job restores the dependencies main last built for it
# (Swatinem/rust-cache: the registry and the dependencies' artifacts, keyed by
# job, toolchain and lockfile, falling back to the job's latest). Only main
# saves: a pull request's cache is visible to that pull request alone, and
# saving one evicts main's from the repository's 10 GB, which every pull
# request restores from. Line tables instead of full debuginfo keep each cache
# a fraction of the size, and a failing test's backtrace still has file:line.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies (alsa/udev/wayland/xkb dev for Bevy)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every crate but `vizij` takes `--all-features`; `vizij` cannot, because
      # its ROS 2 bridge backends (`ros2-dds` / `ros2-zenoh`) are compile-time
      # exclusive, so it gets one pass per backend. The Zenoh pass covers the
      # bins only: examples and the live ROS tests link the `ros2-client` dev
      # dependency, which is DDS. (`scripts/hook-tasks.sh` runs the same
      # passes locally, without `studio` and `tts-piper`.)
      - run: cargo test --workspace --all-features --exclude vizij
      - run: cargo test -p vizij --features ros2-dds,studio,tts-piper
      - run: cargo clippy --workspace --all-features --exclude vizij --bins --examples --tests -- -D warnings
      - run: cargo clippy -p vizij --features ros2-dds,studio,tts-piper --bins --examples --tests -- -D warnings
      - run: cargo clippy -p vizij --features ros2-zenoh --bins -- -D warnings
      - run: cargo fmt --all -- --check

  # The `vizij` library on the targets its other entry points build for: the
  # browser module (wasm32, no desktop half) and the Android activity (arm64,
  # the native driver with a headless front end and the Studio bridge).
  # Neither links an app; each proves the crate's feature and target tables
  # keep the library building where the binary cannot.
  vizij-lib-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p vizij --lib --target wasm32-unknown-unknown --no-default-features
      # The tools come as prebuilt binaries (taiki-e/install-action) here and
      # in the jobs below: `cargo install` would compile them on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,cargo-ndk
      # The speech provider's browser producer, on the runner's Chrome.
      - name: Test the speech provider in headless Chrome
        run: wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" crates/interop/vizij-arora-tts
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Check the library for arm64 Android with the Studio bridge
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -P 26 check -p vizij --lib --no-default-features --features studio

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # wasm32-wasip2 builds arora-animation-module's guest, which
          # @vizij/runtime's tests load (an Arora guest, not a wasm-bindgen
          # wrapper).
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build Graph WASM into npm wrapper pkg/
        run: node scripts/build-graph-wasm.mjs
      # The browser bundle is the whole vizij crate (Bevy included) for
      # wasm32: the cache is what keeps this under the job's budget.
      - name: Build the runtime WASM (the vizij crate for the browser) into npm wrapper pkg/
        run: node scripts/build-runtime-wasm.mjs
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: pnpm install
      - name: Build shared packages
        run: |
          pnpm --filter @vizij/value-json run build
          pnpm --filter @vizij/wasm-loader run build
      - name: Build wasm wrapper packages
        run: |
          pnpm --filter @vizij/node-graph run build
          pnpm --filter @vizij/runtime run build
      - name: Run wrapper tests
        run: |
          pnpm --filter @vizij/node-graph run test
          pnpm --filter @vizij/runtime run test
      # What the browser tests serve: the runtime's dist (the wasm module
      # included) and the two workspace packages its page imports by name.
      - uses: actions/upload-artifact@v4
        with:
          name: browser-bundle
          path: |
            npm/@vizij/runtime/dist
            npm/@vizij/value-json/dist
            npm/@vizij/wasm-loader/dist
          retention-days: 1

  # The bundle on a page: Quori and Toasty against the native references
  # under the same metric, the authoring viewport's calls, and 25
  # load/unload cycles with a flat memory. Two jobs, because the suite is the
  # longest step of the run and its authoring half alone is as long as the
  # rest: each half runs on its own runner against the bundle the `wasm` job
  # built.
  wasm-browser:
    needs: [wasm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, authoring]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: pnpm install
      - uses: actions/download-artifact@v4
        with:
          name: browser-bundle
          path: npm/@vizij
      - name: Fetch the face GLBs from vizij-web
        # Pinned to a commit, so a re-export cannot move a reference.
        run: |
          mkdir -p fixtures
          base="https://raw.githubusercontent.com/vizij-ai/vizij-web/8f9ea2965c6415904ad4e0f87639a370eff0c4d8/apps/vizij-authoring/public/assets"
          curl -fsSL "$base/Quori_Current.glb" -o fixtures/Quori_Current.glb
          curl -fsSL "$base/Quori_Current_Extended.glb" -o fixtures/Quori_Current_Extended.glb
          curl -fsSL "$base/Toasty_Current.glb" -o fixtures/Toasty_Current.glb
      - name: Install Chromium for Playwright
        run: pnpm --filter @vizij/runtime exec playwright install --with-deps chromium
      - name: Run the browser tests (${{ matrix.suite }})
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
          VIZIJ_SNAPSHOT_OUT: ${{ github.workspace }}/browser-snapshots
        run: pnpm --filter @vizij/runtime run test:browser:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-snapshots-${{ matrix.suite }}
          path: browser-snapshots
          if-no-files-found: ignore

  bench-smoke:
    runs-on: ubuntu-latest
    needs: [wasm]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_bench_smoke == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build WASM into npm wrapper pkg/
        run: node scripts/build-wasm.mjs
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: pnpm install
      - name: Build shared packages
        run: |
          pnpm --filter @vizij/value-json run build
          pnpm --filter @vizij/wasm-loader run build
      - name: Build wasm wrapper packages
        run: |
          pnpm --filter @vizij/node-graph run build
      - name: Run perf smoke (signatures + order-of-magnitude)
        run: pnpm run perf:smoke

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies (alsa/udev/wayland/xkb dev for Bevy)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # The job runs no package-manager install, so there is no store to cache.
          package-manager-cache: false
      - name: Verify node registry artifacts are updated
        run: node scripts/verify-node-registry.mjs

  # Visual regression: render Quori/Toasty on lavapipe (Mesa's software Vulkan —
  # no GPU on the runner) and compare to committed references, keeping the
  # web-comparison parity honest. The test is #[ignore]d (it renders), so the
  # `rust` job's `cargo test` never runs it; here we pull the face GLBs from
  # vizij-web and run it with --ignored.
  snapshot-regression:
    runs-on: ubuntu-latest
    env:
      # In a debug build wgpu names every Vulkan object it creates
      # (vkSetDebugUtilsObjectNameEXT). Ubuntu 26.04's Vulkan loader (1.4.341)
      # can crash there while the headless tests create their devices in
      # parallel, so this job's tests render without wgpu's debug labels.
      WGPU_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Install Bevy deps + lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config mesa-vulkan-drivers vulkan-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch the face GLBs and their adaptation sidecars
        # Each face pinned to the commit its reference or test was written
        # against, so a re-export cannot move what a test reads: Quori,
        # Toasty and the Quori and Hugo the sidecar test grafts onto from
        # vizij-web, Quori's Blender export from vizij-web at the commit its
        # reference was rendered from, and Emy from its own repository. The
        # standard-adaptation sidecars the tests graft come from vizij-web
        # too, where each lives beside its GLB, pinned the same way.
        run: |
          mkdir -p fixtures
          base="https://raw.githubusercontent.com/vizij-ai/vizij-web/8f9ea2965c6415904ad4e0f87639a370eff0c4d8/apps/vizij-authoring/public/assets"
          curl -fsSL "$base/Quori_Current_Extended.glb" -o fixtures/Quori_Current_Extended.glb
          curl -fsSL "$base/Toasty_Current.glb" -o fixtures/Toasty_Current.glb
          curl -fsSL "$base/Quori_Current.glb" -o fixtures/Quori_Current.glb
          curl -fsSL "$base/Hugo_Current.glb" -o fixtures/Hugo_Current.glb
          sidecars="https://raw.githubusercontent.com/vizij-ai/vizij-web/e4cefed0cec0f4debb0f36a89b1fc73a5d92a911/apps/vizij-authoring/public/assets"
          for face in Quori_Current_Extended Quori_Current Hugo_Current; do
            curl -fsSL "$sidecars/$face.standard-adaptation.json" -o "fixtures/$face.standard-adaptation.json"
          done
          blender="https://raw.githubusercontent.com/vizij-ai/vizij-web/866ae9d33dfcf38e70b7f6112c979f27f7fae21f/apps/vizij-authoring/public/assets"
          curl -fsSL "$blender/Quori_Latest_Blender_Export.glb" -o fixtures/Quori_Latest_Blender_Export.glb
          emy="https://raw.githubusercontent.com/SaraCooperAmun/vizij_ros_face_launcher/c538974ef24e40a2d2e251768a5e48f148b5bf1f/emy_glbs/emy.glb"
          curl -fsSL "$emy" -o fixtures/emy.glb
      - name: Render Quori/Toasty/Emy and Quori's Blender export on lavapipe and compare to references
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
          WGPU_BACKEND: vulkan
        run: cargo test -p vizij --test snapshot_regression -- --ignored --nocapture
      - name: Compose faces from bytes headless through the library (one, two, 25 cycles)
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
          WGPU_BACKEND: vulkan
        run: cargo test -p vizij --test headless_face -- --ignored --nocapture
      - name: Drive the adapted Quori over the ROS4HRI mapping
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo test -p vizij --lib ros4hri_drives_the_adapted_quori -- --nocapture
      - name: Drive Quori and Hugo through their adaptation sidecars
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo test -p vizij --lib the_sidecars_drive_their_faces -- --nocapture
      - name: Map the action units through Quori's reference adaptation
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo test -p vizij --lib quori_s_adaptation_maps_the_action_units -- --nocapture
      - name: Play Quori's animations on the native device
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo test -p vizij --lib quori_plays_its_animations -- --nocapture
      - name: Step Quori at zero, its program and an animation running
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo test -p vizij --lib quori_stepped_at_zero_shows_a_change_and_nothing_else_moves -- --nocapture
      - name: Key Quori's animations from its glTF document
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo test -p vizij --lib quoris_document_names_the_keys_its_animations_play_on -- --nocapture
      - name: Drive the face from a client on the local bridge
        env:
          VIZIJ_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo test -p vizij --test local_bridge -- --nocapture
