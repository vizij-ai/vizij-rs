name: publish-crates
on:
  push:
    tags:
      - 'crates/*@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Nightly workspace-wide: the vizij animation-module bindep (see
      # rust-toolchain.toml). Publishing a lib still resolves the whole
      # workspace, so it needs the same toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-03
          components: rustfmt, clippy
      - name: Set credentials
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/credentials <<EOF
          [registry]
          token = "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          EOF
      - name: Publish crates
        run: cargo workspaces publish --from-git --yes --no-verify