name: publish-crates

# Publishes the publishable Rust crates to crates.io, in dependency order,
# skipping any crate whose current version is already on the index — so a run
# is always safe to repeat.
#
# Authentication is crates.io Trusted Publishing (OIDC, no long-lived token):
# every published crate carries a Trusted Publisher config on crates.io naming
# this repository and this workflow file. A brand-new crate needs its config
# created (as a pending publisher) before its first publish.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish (ordered, skip-if-published)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          crates="vizij-api-core vizij-graph-core vizij-arora-host vizij-arora-behavior vizij-arora-tts"
          for crate in $crates; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r ".packages[] | select(.name==\"$crate\") | .version")
            if curl -fsS -A "vizij-rs publish-crates (github.com/vizij-ai/vizij-rs)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "$crate@$version already published — skipping"
              continue
            fi
            echo "publishing $crate@$version"
            cargo publish -p "$crate"
            # The next crate's publish verifies against the index; wait until
            # this one is visible there.
            until curl -fsS -A "vizij-rs publish-crates (github.com/vizij-ai/vizij-rs)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; do
              echo "waiting for $crate@$version to appear on the index…"
              sleep 10
            done
          done
