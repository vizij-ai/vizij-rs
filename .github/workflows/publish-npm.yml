name: publish-npm

# Publish any publishable @vizij/* package whose version is not yet on npm.
# The decision is per package against the registry (scripts/ci-publish.mjs),
# so a version bump merged to main publishes itself — usually the Version
# Packages PR that release.yml keeps — and re-runs are idempotent.
#
# The workflow file name is load-bearing: each package's npm trusted publisher
# is configured against `publish-npm.yml`. Renaming this file breaks OIDC
# publishing until every trusted publisher is reconfigured.

on:
  push:
    branches: [main]
    paths:
      - "npm/**"
      - ".github/workflows/publish-npm.yml"
      - "scripts/ci-publish.mjs"
      - "scripts/prepare-publish-manifests.mjs"
  workflow_dispatch:
    inputs:
      package:
        description: >-
          Publish only this package (name under @vizij/, e.g. runtime).
          Leave empty to publish everything the registry is missing.
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC — trusted publishing + provenance, no NPM_TOKEN

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISH_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # setup-node caches for the `packageManager` in package.json unless
          # told not to, and that needs pnpm on PATH; pnpm is installed below,
          # only when something will be published.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; node 24 ships a recent npm but
      # pin the latest to be safe.
      - run: npm install -g npm@latest

      # Asks the registry only, so a push that bumps no version costs no build.
      - name: What npm is missing
        id: check
        run: node scripts/ci-publish.mjs --dry-run

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.pending == 'true'

      - name: Install wasm32 targets
        if: steps.check.outputs.pending == 'true'
        # unknown-unknown for the wasm-bindgen wrappers, wasip1 for the
        # animation-module artifact (an Arora guest module).
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Install wasm-pack
        if: steps.check.outputs.pending == 'true'
        run: cargo install wasm-pack

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.pending == 'true'

      - name: Install dependencies
        if: steps.check.outputs.pending == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish what npm is missing
        if: steps.check.outputs.pending == 'true'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/ci-publish.mjs
