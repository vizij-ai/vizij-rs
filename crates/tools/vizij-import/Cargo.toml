[package]
name = "vizij-import"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Optional import-time passes over a face's .glb, such as choosing triangles that stay unfolded across its morph targets"

[dependencies]
# The GLB container codec; this crate rewrites only the binary chunk and
# leaves the JSON chunk byte-for-byte.
vizij-glb-migrate = { version = "0.1", path = "../vizij-glb-migrate" }
serde_json = "1"
thiserror = "2"
