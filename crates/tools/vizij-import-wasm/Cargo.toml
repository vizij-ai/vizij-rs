[package]
name = "vizij-import-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "wasm-bindgen interface for vizij-import, shipped as the @vizij/import npm package"
repository = "https://github.com/vizij-ai/vizij-rs"

[lib]
# cdylib only: cargo applies no LTO to a lib that is also an rlib, and the
# browser downloads this module.
crate-type = ["cdylib"]

[dependencies]
vizij-import = { version = "0.1", path = "../vizij-import" }
wasm-bindgen = { workspace = true }
serde_json = { workspace = true }

