[package]
name = "scene"
version = "0.0.0"
edition = { workspace = true }
publish = false
description = "Spike: a robot scene in Bevy, to measure what the Studio scene costs in Rust."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

# What the scene reaches into the face crate for, as of the screen work:
# `ViewPlugin` and its `Face`/`PoseFeed`/`ViewOptions`/`OffscreenTarget`/
# `FaceLayer` resources to draw a face into a texture, and `meta::glb_json_chunk`
# to read the robot's own `RobotData`, which Bevy's glTF loader drops. The
# second of those is not about faces at all — it is the seam where an
# `arora-viz-core` would start.
vizij-render = { path = "../vizij-render" }

# The 3d stack: glTF loading, PBR (which carries shadows), the core pipeline,
# windowing, and mesh picking. Composed rather than taking the `3d` collection,
# which pulls `default_platform` — gamepads, clipboard, fonts, x11/wayland.
bevy = { version = "0.19", default-features = false, features = [
  "default_app",
  "3d_bevy_render",
  "scene",
  "png",
  "bevy_winit",
  "std",
  "multi_threaded",
  "picking",
  "mesh_picking",
] }
