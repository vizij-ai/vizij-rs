// The Android packaging of the vizij crate: an APK around the crate's cdylib
// (libvizij.so), which cargo-ndk builds into app/src/main/jniLibs/<abi>/
// before Gradle runs. The recipe is in crates/vizij/README.md (Android).
plugins {
    id 'com.android.application' version '8.11.0' apply false
}
