[package]
name = "vizij"
version = "0.1.0"
edition = { workspace = true }
publish = false
description = "Vizij: the native app — an arora with a head. cargo run opens the Bevy view rendering a GLB face over a natively-run arora device."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
image = "0.25"
uuid = { version = "1", features = ["serde"] }

# The engine. Default features: gltf scene loading, winit windowing, png, etc.
# 0.19 batches morph-target rendering — the faces' main workload. Trimming the
# feature set (ros-viz-rs style) is a follow-up once the app is proven;
# certainty over binary size for now.
bevy = "0.19"

# The device: an arora over the Vizij interop seams, run through the standard
# operator flow (terminal UI on an interactive terminal, the open local bridge
# auto-attached). 9.5 gave the TUI application commands and drop-cancellation
# (the g/b controls, the GLB reload's rebuild); 9.6 makes `local_ws_bridge()`
# public so the app composes the local bridge alongside the --ros2/--studio ones.
# 9.7 adds `with_host_module`, which registers the animation module natively (a
# `HostModule` of in-process functions) — no wasm guest, no bindep, so the
# workspace stays on stable.
arora = "9.7"
# The ROS 2 bridge, attached under `--ros2` (feature `ros2`). Heavy (ros2-client
# + a DDS/Zenoh backend), so opt-in; the Studio bridge rides arora's own
# `studio-bridge` feature instead (`--studio`).
arora-bridge-ros2 = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
# The command pump's async plumbing: the TUI command stream and the per-run
# stop signal.
futures = "0.3"
# Restores the terminal on the window-close exit path, where the device's
# terminal UI (worker thread) never gets to unwind.
crossterm = "0.28"
# Nothing here uses tracing; the dep only turns on its `log` feature for the
# whole build, so Bevy's tracing events (its LogPlugin stays disabled) fall
# through to `log` — into the terminal UI's pane or the snapshot harness's
# env_logger.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }
# For staging neutral inputs into the store (`StateChange`/`Key`); the value
# type is shared with vizij-api-core.
arora-types = "2"
vizij-api-core = { path = "../api/vizij-api-core" }
vizij-graph-core = { path = "../node-graph/vizij-graph-core" }
vizij-arora = { path = "../interop/vizij-arora" }
vizij-arora-host = { path = "../interop/vizij-arora-host" }
vizij-arora-store = { path = "../interop/vizij-arora-store" }
vizij-arora-hal = { path = "../interop/vizij-arora-hal" }
vizij-arora-behavior = { path = "../interop/vizij-arora-behavior" }

# The animation module, linked natively: we register its functions as a host
# module (`with_host_module`) rather than loading its wasm, so no artifact
# dependency and no nightly. Its generated `Value` conversions marshal the calls.
vizij-animation-module = { path = "../interop/vizij-animation-module" }

[dev-dependencies]
# The interpreter-module SPAWN/HALT codecs and RunPolicy the device test
# drives the graph interpreter with.
arora-behavior = "8"
# The bundler, for the Quori integration test (grafts the standard-adaptation
# sidecar into the demo GLB before driving it over the ROS4HRI keys).
vizij-bundle = { path = "../tools/vizij-bundle" }

[features]
default = []
# `--ros2 [namespace][:domain]`: expose the device's keys over ROS 2 topics.
ros2 = ["dep:arora-bridge-ros2"]
# `--studio`: attach the Semio Studio bridge (arora's Zenoh + Firebase
# connector), configured from the environment (DEVICE_OWNERS, …). Needs
# arora-studio-bridge-client 6.1.0+ (firestore 0.50 / gcloud-sdk 0.30.2).
studio = ["arora/studio-bridge"]
