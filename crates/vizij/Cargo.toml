[package]
name = "vizij"
version = "0.1.0"
edition = { workspace = true }
publish = false
description = "Vizij: an arora with a head. One crate: the Bevy view rendering a GLB face and the arora device driving it, as a library on every target (desktop, browser, Android) and as the `vizij` binary on desktop."

# The library is the view + face + modules every entry point composes: the desktop
# binary below, the browser module (a wasm-bindgen cdylib) and the Android
# activity (a cdylib the activity loads).
[lib]
crate-type = ["rlib", "cdylib"]

# The desktop app: the CLI, the terminal operator UI, the bridges.
[[bin]]
name = "vizij"
required-features = ["desktop"]

# The browser bundle: `wasm-pack build crates/vizij --target web --release --
# --no-default-features` (`scripts/build-runtime-wasm.mjs`). wasm-opt shrinks
# it for size and strips the debug names, the larger of the two wins.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--strip-debug"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"], optional = true }
log = "0.4"
env_logger = { version = "0.11", optional = true }
# PNG only: the snapshot files and the published face frame; bevy_image's own
# `image` unifies with this one, so every codec listed here ships in the wasm.
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["serde"] }

# The engine, named crate by crate rather than through the `3d_bevy_render`
# umbrella: that umbrella also brings text, gizmos, glTF animation, anti-
# aliasing, post-processing, tonemapping and SMAA lookup textures, ktx2/zstd
# and hdr/png decoders, none of which a face uses, and `default_app` adds
# reflection auto-registration; a browser page pays every one of them in
# download. What stays is the 3D render path (glTF, PBR, morph targets —
# 0.19 batches morph-target rendering, the faces' main workload), scene
# spawning, winit windowing, mesh picking, WebGL2 as the browser backend,
# and the log plugin the apps disable in favor of `log`. The face GLBs embed
# no textures, so no image codec. The per-platform windowing backends are in
# the target tables below.
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
    "async_executor",
    "std",
    "multi_threaded",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_image",
    "bevy_color",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_gltf",
    "bevy_scene",
    "morph",
    "bevy_winit",
    "bevy_picking",
    "mesh_picking",
    "webgl2",
] }
# The device: an arora over the Vizij interop seams, run through the standard
# operator flow (terminal UI on an interactive terminal, the open local bridge
# auto-attached). 9.5 gave the TUI application commands and drop-cancellation
# (the g/b controls, the GLB reload's rebuild); 9.6 makes `local_ws_bridge()`
# public so the app composes the local bridge alongside the --ros2/--studio ones.
# 9.7 adds `with_host_module`, which registers the animation module natively (a
# `HostModule` of in-process functions) — no wasm guest, no bindep, so the
# workspace stays on stable. No default features here: the executor-free
# slice builds on every target; the native target table below adds `native`
# (wasmtime, the local WS bridge, the operator flow) and the desktop feature
# adds `tui`.
arora = { version = "9.10", default-features = false }
# The ROS 2 bridge, attached under `--ros2` (feature `ros2`). Heavy (ros2-client
# + a DDS/Zenoh backend), so opt-in; the Studio bridge rides arora's own
# `studio-bridge` feature instead (`--studio`). It carries the skill plane the
# ros4hri exposure profile binds `/skill/look_at` and `/skill/say` through:
# bound actions announce their REP-2016 hashes (reachable from native rmw_zenoh
# clients) and run feedback may be a record (the say skill's viseme/intensity).
# 6.3 is where that profile publishes the face image, so the view declares
# nothing itself.
arora-bridge-ros2 = { version = "6.3", optional = true, default-features = false }
# The Status enumeration ids the gaze and tts contracts mark their action shapes with.
arora-behavior-tree-types = "1"
# The built-in key prefix the ROS 2 input declaration leaves out.
arora-behavior = "8"
# Restores the terminal on the window-close exit path, where the device's
# terminal UI (worker thread) never gets to unwind.
crossterm = { version = "0.28", optional = true }
# The desktop app's data directory (the remembered face, the Studio identity).
dirs = { version = "6", optional = true }
# The system's file dialog for opening a face (`O`); the XDG portal on Linux
# so no GTK is linked.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"], optional = true }
# `--glb <url>`: the face fetched whole (reqwest is already in the tree).
reqwest = { version = "0.13", optional = true }
# `list-displays`: the monitors straight from the event loop, no window (the
# version Bevy's winit backend uses).
winit = { version = "0.30", default-features = false, optional = true }
# Nothing here uses tracing; the dep only turns on its `log` feature for the
# whole build, so Bevy's tracing events (its LogPlugin stays disabled) fall
# through to `log` — into the terminal UI's pane or the snapshot harness's
# env_logger.
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }
# For staging neutral inputs into the store (`StateChange`/`Key`); the value
# type is shared with vizij-api-core.
arora-types = "2"
vizij-api-core = { path = "../api/vizij-api-core" }
vizij-graph-core = { path = "../node-graph/vizij-graph-core" }
vizij-arora = { path = "../interop/vizij-arora" }
# `frames`: the rendered face as its `sensor_msgs` image value, the shape the
# browser runtime would build too if it published frames.
vizij-arora-host = { path = "../interop/vizij-arora-host", features = ["publish-frames"] }
vizij-arora-store = { path = "../interop/vizij-arora-store" }
vizij-arora-hal = { path = "../interop/vizij-arora-hal" }
vizij-arora-behavior = { path = "../interop/vizij-arora-behavior" }

# The animation module, linked natively: we register its functions as a host
# module (`with_host_module`) rather than loading its wasm, so no artifact
# dependency and no nightly. Its generated `Value` conversions marshal the calls.
vizij-animation-module = { path = "../interop/vizij-animation-module" }

# The speech provider — the say skill's `say` — over the Vizij TTS cloud
# function: rodio plays it natively, the page's hook in the browser.
vizij-arora-tts = { version = "3", path = "../interop/vizij-arora-tts" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The native driver (`native`): the stand-alone device on a worker thread under
# arora's operator flow — `native` is the run loop, the local WS bridge and
# the module executors — with the bridges the build adds.
arora = { version = "9.10", default-features = false, features = ["native"] }
# The open local bridge (`device::bridge`): the WebSocket server, its
# registry and its control panel, on arora's line.
arora-bridge-ws = "4"
arora-bridge = "4.1"
async-trait = "0.1"
# The device thread's runtime: the operator flow and the bridges are async,
# the supervisor drives them on a multi-thread runtime.
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# The front-end pump's async plumbing: the merged command streams.
futures = "0.3"
# `vizij-piper` is the local speech provider (feature `tts-piper`) — its
# build self-provisions libpiper and a patched default voice, and `rodio`
# plays its audio; note it links GPLv3 code into the binary.
rodio = { version = "0.20", optional = true }
vizij-piper = { path = "../interop/vizij-piper", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser module (`web`): the shared JS surface of a device — `step`,
# the self-pacing `run`, the Value<->JSON store accessors — wraps each face's
# device; wasm-bindgen carries the module's own surface.
arora-web = "6.1"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
# `log` records (Bevy's, through tracing's `log` feature, and the crate's
# own) reach the browser console.
console_log = "1"
# uuid v4 on wasm needs a browser RNG (selects getrandom's wasm_js backend).
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# The image messages a published frame is read back as, so a field landing in
# the wrong place fails in a unit test rather than at a ROS subscriber.
arora-msgs-ros2 = "1"
# The bundler, for the Quori integration test (grafts the standard-adaptation
# sidecar into the demo GLB before driving it over the ROS4HRI keys).
vizij-bundle = { path = "../tools/vizij-bundle" }
# The typed ROS 2 peer of the live action E2E (the semio-ai ros2-client fork;
# the library imports as `ros2_client`). The same line the bridge speaks: two
# versions in one build are two crates, and the peer's topics stop typing
# against the bridge's.
ros2-client = { package = "ros2-client-multi-rmw", version = "0.13", default-features = false, features = ["jazzy", "dds"] }
rand = "0.9"
# The wire test's client, on the local bridge's WebSocket, and its GET of
# the control panel.
tokio-tungstenite = "0.24"
reqwest = "0.13"

[features]
default = ["desktop"]
# The desktop app: the CLI and the terminal operator UI. Off, the library is
# the view, the composition and the native driver with a headless front end
# — what the Android activity builds on; the browser module builds on the
# view and the composition alone.
desktop = [
    "arora/tui",
    "dep:crossterm",
    "dep:clap",
    "dep:env_logger",
    "dep:dirs",
    "dep:rfd",
    "dep:reqwest",
    "dep:winit",
]
# `--ros2 [namespace][:domain]`: expose the device's keys over ROS 2 topics,
# over one RMW backend per build — the bridge's `dds` / `zenoh` features are
# mutually exclusive, exposed here under the bridge's consumer convention:
# `ros2-dds` (ROS 2's default RMW; `ros2` is its alias) or `ros2-zenoh`
# (rmw_zenoh-compatible; needs a running router, `ros2 run rmw_zenoh_cpp
# rmw_zenohd`, reached through `ZENOH_CONFIG_OVERRIDE` /
# `ZENOH_SESSION_CONFIG_URI` exactly as rmw_zenoh itself). The live ROS tests
# are DDS (the `ros2-client` dev dependency), so they run under `ros2-dds`.
ros2 = ["ros2-dds"]
ros2-dds = ["dep:arora-bridge-ros2", "arora-bridge-ros2/dds"]
ros2-zenoh = ["dep:arora-bridge-ros2", "arora-bridge-ros2/zenoh"]
# `--studio`: attach the Semio Studio bridge (arora's Zenoh + Firebase
# connector), configured from the environment (DEVICE_OWNERS, …). Needs
# arora-studio-bridge-client 6.1.0+ (firestore 0.50 / gcloud-sdk 0.30.2).
studio = ["arora/studio-bridge"]
# Swap the TTS provider: the local Piper module (`tts_piper.rs`) instead of the
# cloud module (`tts.rs`). Same `say` contract; fully offline at run time; the
# first build downloads and prepares everything it needs.
tts-piper = ["dep:vizij-piper", "dep:rodio"]
