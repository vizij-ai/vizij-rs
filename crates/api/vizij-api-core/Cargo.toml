[package]
name = "vizij-api-core"
version = "3.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Vizij's shared Value/Shape/TypedPath contract over Arora's Value: the geometry types of arora-geometry, the colour of arora-graphics-types, records and enumerations, with coercion, write batches and the graph-spec JSON forms."
repository = "https://github.com/vizij-ai/vizij-rs"
readme = "README.md"

[dependencies]
arora-geometry = "1"
arora-graphics-types = "1"
arora-types = "3.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hashbrown = { version = "0.17", features = ["serde"] }
uuid = "1"
