[package]
name        = "vizij-graph-wasm"
version = "1.0.0"
edition     = "2021"
license     = "Apache-2.0"
description = "wasm‑bindgen interface for Vizij node graph."
repository  = "https://github.com/vizij-ai/vizij-rs"
homepage    = "https://github.com/vizij-ai/vizij-rs"
documentation = "https://docs.rs/vizij-graph-wasm"
readme      = "README.md"
keywords    = ["vizij", "node", "graph", "wasm"]
categories  = ["wasm", "rendering"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
hashbrown    = { workspace = true }
arora-node-graph = "1"
arora-shape = "1"
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["urdf_ik"]
# enable console error hook if desired
console_error = ["console_error_panic_hook"]
urdf_ik = ["arora-node-graph/urdf_ik"]
