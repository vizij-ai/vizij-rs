[package]
name = "vizij-arora-behavior"
version = "8.0.0"
edition.workspace = true
license = "Apache-2.0"
description = "A Vizij node graph driven as an Arora behavior interpreter (ProcessingGraph)."
repository = "https://github.com/vizij-ai/vizij-rs"

[dependencies]
arora-behavior = "9.1"
# Declares the `Status` enumeration id the gaze contract's signature returns.
arora-behavior-tree-types = "2"
arora-types = "3"
# Declares the run_behavior contract the interpreter describes.
arora-module = "2.1"
# The channel key holds travel on: a hold handle is `Send` and `Sync`, so a
# client on another thread holds keys through it.
crossbeam-channel = "0.5"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = "1"
vizij-api-core = { version = "3", path = "../../api/vizij-api-core" }
vizij-graph-core = { version = "4", path = "../../node-graph/vizij-graph-core" }
# The skill fragments (the gaze contract grafts the shipped look_at asset).
vizij-arora-host = { version = "7", path = "../vizij-arora-host" }

[dev-dependencies]
arora-simple-data-store = "3"
# A store that keeps key meta, for the declared types a keyed record takes.
vizij-arora-store = { path = "../vizij-arora-store" }
