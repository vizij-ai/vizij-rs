[package]
name = "vizij-arora-behavior"
version = "5.0.1"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "A Vizij node graph driven as an Arora behavior interpreter (ProcessingGraph)."
repository = "https://github.com/vizij-ai/vizij-rs"

[dependencies]
arora-behavior = "9.1"
# Declares the `Status` enumeration id the gaze contract's signature returns.
arora-behavior-tree-types = "2"
arora-types = "3"
# Declares the run_behavior contract the interpreter describes.
arora-module = "2.1"
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = "1"
vizij-api-core = { version = "2", path = "../../api/vizij-api-core" }
vizij-graph-core = { version = "2.2", path = "../../node-graph/vizij-graph-core" }
# The skill fragments (the gaze contract grafts the shipped look_at asset).
vizij-arora-host = { version = "6", path = "../vizij-arora-host" }

[dev-dependencies]
arora-simple-data-store = "3"
