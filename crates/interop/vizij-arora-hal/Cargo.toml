[package]
name = "vizij-arora-hal"
version = "0.0.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Vizij rig presented as an Arora HAL (arora-hal)."

[dependencies]
# 4.1: `Hal::assets`, how the device serves the rig's model; 4.3:
# `Hal::describe_keys`, how the rig opens its frame rate to remote writers.
arora-hal = "4.3"
# 3.2: `KeyMeta::in_unit`.
arora-types = "3.2"
async-trait = "0.1"
futures-channel = "0.3"
futures-core = "0.3"
vizij-api-core = { version = "3", path = "../../api/vizij-api-core" }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
