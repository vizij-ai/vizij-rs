[package]
name = "vizij-animation-artifact"
version = "0.0.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Writes arora-animation-module's module directory (header, records and guest), the Arora guest @vizij/runtime's tests load."

[dependencies]
# `module-dir`: the module directory's header, records and guest file.
arora-animation-module = { version = "2", features = ["module-dir"] }
