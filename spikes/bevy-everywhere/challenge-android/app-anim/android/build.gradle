// Minimal Android wrapper that packages the Rust cdylib (libros_viz_rs.so,
// built by cargo-ndk into app/src/main/jniLibs) into an installable APK using
// Bevy's GameActivity backend. There is no hand-written Java/Kotlin: the
// activity comes from the androidx games-activity AAR, and the manifest points
// it at our native library.
plugins {
    id 'com.android.application' version '8.11.0' apply false
}
